# Reference nginx config for corback — api.vdicube.com
#
# Apply to: /etc/nginx/sites-available/api.vdicube.com
#           /etc/nginx/sites-enabled/api.vdicube.com -> ../sites-available/api.vdicube.com
#
# After editing, validate with: nginx -t
# Reload with:                   systemctl reload nginx

server {
    listen 443 ssl;
    server_name api.vdicube.com;

    # --- /billing/ — restricted to GitHub Actions IPs only ---
    #
    # IP ranges are maintained in github-actions-allowlist.conf.
    # Run infra/nginx/update-github-actions-allowlist.sh on the server
    # (or locally, then scp the result) whenever GitHub updates their ranges —
    # check https://api.github.com/meta and aim for a monthly refresh.
    #
    # Path on the server (adjust if different):
    #   /etc/nginx/github-actions-allowlist.conf
    location /billing/ {
        include /etc/nginx/github-actions-allowlist.conf;

        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- all other API routes ---
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
