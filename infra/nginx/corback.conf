# Reference nginx config for corback — api.vdicube.com
#
# Apply to: /etc/nginx/sites-available/api.vdicube.com
#           /etc/nginx/sites-enabled/api.vdicube.com -> ../sites-available/api.vdicube.com
#
# After editing, validate with: nginx -t
# Reload with:                   systemctl reload nginx

server {
    listen 443 ssl;
    server_name api.vdicube.com;

    # --- all API routes ---
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
