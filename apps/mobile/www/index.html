<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Not configured</title>
    <!--
      #1074 (mobile app WP3) — the one local document the shell owns.

      The app's UI is the deployed Members App, loaded from `server.url`
      (`docs/mobile-app.md` §2), so this page is never shown while that URL is
      reachable: Capacitor requires a `webDir`, and this is what the WebView
      falls back to when the shell is built or run with no server URL at all.
      The "web is down" case the member actually sees is the Members App's own
      error screen with a retry (`NativeAppState`, WP2) — a second copy of that
      screen here could not retry, because it has no app to retry into.

      It carries no gym, no theme and no copy that belongs to a locale file:
      nothing here knows which gym a member belongs to, which is why the colours
      are the layout's static ones (#18181b, the same `theme-color` the Members
      App declares before any gym is resolved) rather than a Theme's.
    -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #18181b;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.5rem; }
      p { font-size: 0.9375rem; line-height: 1.5; margin: 0; color: #a1a1aa; }
    </style>
  </head>
  <body>
    <main>
      <h1>Not configured</h1>
      <p>
        This build has no application URL. Set one in the app profile and run
        <code>npm run sync</code> again.
      </p>
    </main>
  </body>
</html>
