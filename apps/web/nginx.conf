# cordel.tech — static site. TLS is Traefik's; this container speaks HTTP on 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self';" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # `/terms` rather than `/terms.html`.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The legal pages stay public and linked from every footer (LSSI art. 10
    # needs the holder identifiable) but are kept out of search results, so the
    # holder's name does not surface in a search. The product pages stay indexable.
    location ~ ^/(legal|terms|privacy)(\.html)?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self';" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri.html =404;
    }
}
