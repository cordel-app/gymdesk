server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index checkout.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.monei.com; frame-src https://js.monei.com https://*.monei.com; connect-src 'self' https://api.monei.com https://js.monei.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://js.monei.com;" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Token lookups — Traefik terminates TLS; this proxies to the Gymdesk API.
    location /payment-page/ {
        proxy_pass https://api.vdicube.com;
        proxy_ssl_server_name on;
        proxy_set_header Host api.vdicube.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /error.html {
        try_files /error.html =404;
    }

    location / {
        try_files $uri /checkout.html;
    }
}
