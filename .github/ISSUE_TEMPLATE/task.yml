name: Task
description: A small, self-contained fix or change that an unattended routine can pick up without a plan.
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Issues of type **Task** are consumed by the `gymdesk-tasks` routine, which implements them without a planning or approval step. Use this form only for work that fits that — anything with new API surface, a migration or significant UI should be a normal issue.
  - type: textarea
    id: current
    attributes:
      label: Current behaviour
      description: What happens today. Include the screen or endpoint, and the gym or member if it matters.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen instead.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Screen, route, endpoint or file, if known. Add screenshots or error text here.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This needs no new API surface, no database migration and no significant UI work.
          required: true
