name: Deploy Alloy

on:
  push:
    branches: [main]
    paths:
      - 'infra/alloy/**'
      - '.github/workflows/deploy-alloy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Alloy to ${{ matrix.name }}
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      matrix:
        include:
          - name: corback
            ssh_host: CORBACK_SSH_HOST
            ssh_key: CORBACK_SSH_PRIVATE_KEY
            config_file: infra/alloy/config-corback.alloy
          - name: corfront
            ssh_host: CORFRONT_SSH_HOST
            ssh_key: CORFRONT_SSH_PRIVATE_KEY
            config_file: infra/alloy/config-corfront.alloy

    steps:
      - uses: actions/checkout@v4

      - name: Encode config files
        id: files
        run: |
          echo "config=$(base64 -w0 ${{ matrix.config_file }})" >> $GITHUB_OUTPUT
          echo "service=$(base64 -w0 infra/alloy/alloy.service)" >> $GITHUB_OUTPUT

      - name: Deploy to ${{ matrix.name }}
        uses: appleboy/ssh-action@v1
        env:
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          CONFIG_B64: ${{ steps.files.outputs.config }}
          SERVICE_B64: ${{ steps.files.outputs.service }}
        with:
          host: ${{ secrets[matrix.ssh_host] }}
          username: podman
          key: ${{ secrets[matrix.ssh_key] }}
          envs: GRAFANA_CLOUD_API_KEY,CONFIG_B64,SERVICE_B64
          script: |
            set -euo pipefail
            ALLOY_VERSION="1.5.1"
            ARCH="arm64"
            BIN="$HOME/bin/alloy"
            CONFIG_DIR="$HOME/.config/alloy"
            UNIT_DIR="$HOME/.config/systemd/user"

            mkdir -p "$HOME/bin" "$CONFIG_DIR" "$UNIT_DIR"

            # Install binary only when version differs
            INSTALLED=$("$BIN" --version 2>/dev/null | grep -oP '[\d.]+' | head -1 || echo "none")
            if [ "$INSTALLED" != "$ALLOY_VERSION" ]; then
              echo "==> Downloading Alloy $ALLOY_VERSION (arm64)"
              TMP=$(mktemp -d)
              curl -fsSL \
                "https://github.com/grafana/alloy/releases/download/v${ALLOY_VERSION}/alloy-linux-${ARCH}.zip" \
                -o "$TMP/alloy.zip"
              if command -v unzip &>/dev/null; then
                unzip -q "$TMP/alloy.zip" -d "$TMP"
              else
                python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
                  "$TMP/alloy.zip" "$TMP"
              fi
              install -m 755 "$TMP/alloy-linux-${ARCH}" "$BIN"
              rm -rf "$TMP"
            else
              echo "==> Alloy $ALLOY_VERSION already installed"
            fi

            # Write config (decoded from base64 — not secret)
            echo "$CONFIG_B64" | base64 -d > "$CONFIG_DIR/config.alloy"

            # Write unit file
            echo "$SERVICE_B64" | base64 -d > "$UNIT_DIR/alloy.service"

            # Write secrets (600, never echoed)
            umask 077
            printf 'GRAFANA_CLOUD_API_KEY=%s\n' "${GRAFANA_CLOUD_API_KEY}" > "$CONFIG_DIR/secrets"
            chmod 600 "$CONFIG_DIR/secrets"

            # Enable and restart
            systemctl --user daemon-reload
            systemctl --user enable alloy
            systemctl --user restart alloy

            sleep 3
            systemctl --user is-active alloy || {
              echo "ERROR: Alloy failed to start"
              journalctl --user -u alloy --no-pager -n 40 || true
              exit 1
            }
            echo "==> Alloy running on ${{ matrix.name }}"
