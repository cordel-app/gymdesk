name: Deploy Member

on:
  push:
    branches: [main]
    paths:
      - 'apps/member/**'
      - '.github/workflows/deploy-member.yml'
  workflow_dispatch:
    # #784: a manual run picks its GitHub environment; a push to main (no
    # input) deploys to `dev`, exactly as before.
    inputs:
      environment:
        description: GitHub environment to deploy to
        type: choice
        options: [dev, pro]
        default: dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fitness-members

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/member/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          no-cache: true
          # #1114 — NEXT_PUBLIC_APP_ENV_LABEL / NEXT_PUBLIC_APP_BRAND_NAME are the
          # browser title's environment label and brand. GitHub *variables* rather
          # than secrets (neither is one) and per environment, so a `pro`
          # build cannot carry the dev title; unset, the title reads the app's own
          # role alone rather than a wrong brand.
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
            NEXT_PUBLIC_MOBILE_APP_SCHEME=${{ vars.MOBILE_APP_SCHEME }}
            NEXT_PUBLIC_APPLE_SIGN_IN=${{ vars.APPLE_SIGN_IN }}
            NEXT_PUBLIC_APP_ENV_LABEL=${{ vars.APP_ENV_LABEL }}
            NEXT_PUBLIC_APP_BRAND_NAME=${{ vars.APP_BRAND_NAME }}

  # The deploy runs on the self-hosted runner on corfront (outbound-only agent;
  # no SSH, #2044). Only a workflow that no pull request can trigger may use it
  # (api/src/test/self-hosted-runner-guard.unit.test.ts).
  deploy:
    name: Deploy
    needs: build
    runs-on: [self-hosted, corfront, "${{ inputs.environment || 'dev' }}"]
    environment: ${{ inputs.environment || 'dev' }}
    permissions: {}

    steps:
      - name: Deploy to corfront
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
          CORDEL_FITNESS_API_URL: ${{ vars.CORDEL_FITNESS_API_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          MOBILE_APP_ASSOCIATIONS: ${{ vars.MOBILE_APP_ASSOCIATIONS }}
          TZ: ${{ vars.TZ }}
        run: |
            set -euo pipefail

            echo "$GHCR_PAT" | podman login ghcr.io -u "$GHCR_USER" --password-stdin

            # Each deploy pulls a new :latest and the previous image loses its
            # tag; those dangling images fill the disk and stop deploys at the
            # check below (#1850 follow-up: corfront hit 780 MB free). Prune only
            # dangling images: a tagged image, or one a running container uses,
            # is never touched — which also makes this safe for the other two
            # apps that deploy to this host.
            podman image prune -f || true

            AVAILABLE=$(df / --output=avail | tail -1)
            if [ "$AVAILABLE" -lt 1048576 ]; then
              echo "ERROR: Less than 1GB free on disk (${AVAILABLE}KB available). Aborting deploy."
              exit 1
            fi

            podman pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # --- Runtime env: sync from GitHub (source of truth) ---------------
            # Like deploy.yml (#1177): this job is the only writer of the unit's
            # Environment= lines. Every deploy deletes them and writes the block
            # below from the GitHub environment, so a value is changed in GitHub and
            # redeployed, never hand-edited on corfront. The rest of the unit (ports,
            # network, restart policy) stays Oscar's and is not touched.
            UNIT="$HOME/.config/containers/systemd/fitness-members.container"
            if [ ! -f "$UNIT" ]; then echo "ERROR: quadlet $UNIT not found"; exit 1; fi
            if ! grep -q '^\[Container\]$' "$UNIT"; then
              echo "ERROR: [Container] section not found in $UNIT"; exit 1
            fi
            # The API address the unit carries now, printed so a change is visible in
            # the run log. Addresses only; a secret's value is never printed.
            for k in CORDEL_FITNESS_API_URL; do
              cur=$(sed -n "s/^Environment=\"\{0,1\}$k=//p" "$UNIT" | sed 's/^"//; s/"$//')
              echo "Unit $k (before): ${cur:-<unset>} -> GitHub: ${!k:-<unset>}"
            done
            # Required values must be present: fail before the unit is touched, so a
            # missing GitHub variable leaves the running app exactly as it was.
            for v in CORDEL_FITNESS_API_URL CLERK_SECRET_KEY; do
              if [ -z "${!v:-}" ]; then echo "ERROR: $v is empty in GitHub env '${{ inputs.environment || 'dev' }}'"; exit 1; fi
            done
            # A key the unit carries that this job does not write would be lost on
            # the first deploy. Refuse instead, naming the keys (never the values),
            # so it is added to GitHub and to this list rather than dropped silently.
            KNOWN=" CORDEL_FITNESS_API_URL CLERK_SECRET_KEY MOBILE_APP_ASSOCIATIONS TZ "
            UNKNOWN=""
            for k in $(sed -n 's/^Environment=//p' "$UNIT" | sed 's/^"//; s/=.*//'); do
              case "$KNOWN" in *" $k "*) ;; *) UNKNOWN="$UNKNOWN $k" ;; esac
            done
            if [ -n "$UNKNOWN" ]; then
              echo "ERROR: $UNIT sets variables this workflow does not manage:$UNKNOWN"
              echo "Add them to GitHub and to this workflow first; nothing was changed."
              exit 1
            fi

            umask 077
            cp "$UNIT" "$UNIT.bak.$(date +%s)"
            ls -t "$UNIT".bak.* 2>/dev/null | tail -n +4 | xargs -r rm -f
            # One KEY=value per line; `%` is a systemd specifier, so it is doubled.
            ENV_TMP="$(mktemp)"
            cat > "$ENV_TMP" <<ENVEOF
            CORDEL_FITNESS_API_URL=${CORDEL_FITNESS_API_URL}
            CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
            MOBILE_APP_ASSOCIATIONS=${MOBILE_APP_ASSOCIATIONS:-}
            TZ=${TZ:-}
            ENVEOF
            # An optional variable left unset is not written at all, so the app
            # reads its own default rather than an empty string.
            sed -i '/^[A-Z_0-9]*=$/d' "$ENV_TMP"
            UNIT_ENV="$(mktemp)"
            sed 's/%/%%/g; s/^/Environment=/' "$ENV_TMP" > "$UNIT_ENV"
            rm -f "$ENV_TMP"
            sed -i '/^Environment=/d' "$UNIT"
            sed -i "/^\[Container\]$/r $UNIT_ENV" "$UNIT"
            rm -f "$UNIT_ENV"
            systemctl --user daemon-reload

            # The image and the environment are refreshed; restart picks up both.
            if ! systemctl --user restart fitness-members.service; then
              echo "ERROR: systemctl restart failed"
              systemctl --user status fitness-members.service --no-pager --lines=40 || true
              journalctl --user -xeu fitness-members.service --no-pager -n 60 || true
              podman ps -a --filter name=fitness-members || true
              echo "--- image inspection ---"
              podman image inspect ghcr.io/${{ env.IMAGE_NAME }}:latest --format '{{.Architecture}} / {{.Os}} / cmd={{.Config.Cmd}} / entrypoint={{.Config.Entrypoint}}' || true
              echo "--- direct run: node --version + server.js exists ---"
              podman run --rm --entrypoint /bin/sh ghcr.io/${{ env.IMAGE_NAME }}:latest -c 'node --version && ls -la /app/apps/member/server.js 2>&1' 2>&1 || echo "(entrypoint probe failed)"
              echo "--- direct run: actual CMD to stderr ---"
              timeout 5 podman run --rm ghcr.io/${{ env.IMAGE_NAME }}:latest 2>&1 | head -20 || true
              exit 1
            fi

            # Prints why the health check below failed rather than only that it did:
            # every frontend deploy on corfront has failed it since 2026-10-04 ~22:00
            # UTC while the public hostnames kept answering. Read-only.
            diagnose() {
              echo "--- health check diagnostics (:8082/en) ---"
              for h in localhost 127.0.0.1 '[::1]'; do
                printf '%s -> ' "$h"
                curl -sS -o /dev/null --max-time 5 -w 'HTTP %{http_code} from %{remote_ip}\n' "http://$h:8082/en" 2>&1 || true
              done
              echo "--- localhost resolves to ---"; getent ahosts localhost || true
              echo "--- listeners on :8082 ---"; ss -tlnp 2>/dev/null | grep ':8082' || echo "nothing listening on :8082"
              echo "--- published ports ---"; podman port fitness-members 2>&1 || true
              echo "--- proxy variables ---"; p=$(env | grep -i -E '^(http|https|no|all)_proxy=' | sed -E 's#(://)[^@/]*@#\1***@#' || true); echo "${p:-none set}"
              echo "--- from inside the container ---"
              podman exec fitness-members node -e "fetch('http://127.0.0.1:8082/en').then(r=>console.log('HTTP',r.status)).catch(e=>console.log('error',e.cause?.code||e.message))" 2>&1 || true
            }

            # 127.0.0.1, never `localhost`: on corfront `localhost` resolves to ::1 first,
            # pasta accepts the IPv6 connection and the app inside answers only IPv4, so
            # the connection is reset and curl never falls back (every frontend deploy
            # failed this check from 2026-10-04 ~22:00 UTC until this was found, #1171).
            # Next.js answers its first request late (cold start, port forward
            # still wiring up), so retry for up to ~60s instead of one shot.
            ok=0
            for i in $(seq 1 20); do
              if curl -sf --max-time 10 -o /dev/null http://127.0.0.1:8082/en; then ok=1; break; fi
              sleep 3
            done
            [ "$ok" = 1 ] || \
              { echo "ERROR: app not responding"; diagnose; systemctl --user status fitness-members.service --no-pager || true; podman logs fitness-members 2>/dev/null || true; exit 1; }
            echo "Health check OK"
