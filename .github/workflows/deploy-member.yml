name: Deploy Member

on:
  push:
    branches: [main]
    paths:
      - 'apps/member/**'
      - '.github/workflows/deploy-member.yml'
  workflow_dispatch:
    # #784: a manual run picks its GitHub environment; a push to main (no
    # input) deploys to `dev`, exactly as before.
    inputs:
      environment:
        description: GitHub environment to deploy to
        type: choice
        options: [dev, pro]
        default: dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fitness-members

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/member/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          no-cache: true
          # #1114 — NEXT_PUBLIC_APP_ENV_LABEL / NEXT_PUBLIC_APP_BRAND_NAME are the
          # browser title's environment label and brand. GitHub *variables* rather
          # than secrets (neither is one) and per environment, so a `pro`
          # build cannot carry the dev title; unset, the title reads the app's own
          # role alone rather than a wrong brand.
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
            NEXT_PUBLIC_APP_ENV_LABEL=${{ vars.APP_ENV_LABEL }}
            NEXT_PUBLIC_APP_BRAND_NAME=${{ vars.APP_BRAND_NAME }}

      - name: Deploy to corfront
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORFRONT_SSH_HOST }}
          username: podman
          key: ${{ secrets.CORFRONT_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            echo "${{ secrets.GHCR_PAT }}" | podman login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            AVAILABLE=$(df / --output=avail | tail -1)
            if [ "$AVAILABLE" -lt 1048576 ]; then
              echo "ERROR: Less than 1GB free on disk (${AVAILABLE}KB available). Aborting deploy."
              exit 1
            fi

            podman pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # Oscar owns the systemd unit (ports, env vars, restart policy);
            # we just refresh the image and restart it.
            if ! systemctl --user restart fitness-members.service; then
              echo "ERROR: systemctl restart failed"
              systemctl --user status fitness-members.service --no-pager --lines=40 || true
              journalctl --user -xeu fitness-members.service --no-pager -n 60 || true
              podman ps -a --filter name=fitness-members || true
              echo "--- image inspection ---"
              podman image inspect ghcr.io/${{ env.IMAGE_NAME }}:latest --format '{{.Architecture}} / {{.Os}} / cmd={{.Config.Cmd}} / entrypoint={{.Config.Entrypoint}}' || true
              echo "--- direct run: node --version + server.js exists ---"
              podman run --rm --entrypoint /bin/sh ghcr.io/${{ env.IMAGE_NAME }}:latest -c 'node --version && ls -la /app/apps/member/server.js 2>&1' 2>&1 || echo "(entrypoint probe failed)"
              echo "--- direct run: actual CMD to stderr ---"
              timeout 5 podman run --rm ghcr.io/${{ env.IMAGE_NAME }}:latest 2>&1 | head -20 || true
              exit 1
            fi

            # Prints why the health check below failed rather than only that it did:
            # every frontend deploy on corfront has failed it since 2026-10-04 ~22:00
            # UTC while the public hostnames kept answering. Read-only.
            diagnose() {
              echo "--- health check diagnostics (:8082/en) ---"
              for h in localhost 127.0.0.1 '[::1]'; do
                printf '%s -> ' "$h"
                curl -sS -o /dev/null --max-time 5 -w 'HTTP %{http_code} from %{remote_ip}\n' "http://$h:8082/en" 2>&1 || true
              done
              echo "--- localhost resolves to ---"; getent ahosts localhost || true
              echo "--- listeners on :8082 ---"; ss -tlnp 2>/dev/null | grep ':8082' || echo "nothing listening on :8082"
              echo "--- published ports ---"; podman port fitness-members 2>&1 || true
              echo "--- proxy variables ---"; p=$(env | grep -i -E '^(http|https|no|all)_proxy=' | sed -E 's#(://)[^@/]*@#\1***@#' || true); echo "${p:-none set}"
              echo "--- from inside the container ---"
              podman exec fitness-members node -e "fetch('http://127.0.0.1:8082/en').then(r=>console.log('HTTP',r.status)).catch(e=>console.log('error',e.cause?.code||e.message))" 2>&1 || true
            }

            # 127.0.0.1, never `localhost`: on corfront `localhost` resolves to ::1 first,
            # pasta accepts the IPv6 connection and the app inside answers only IPv4, so
            # the connection is reset and curl never falls back (every frontend deploy
            # failed this check from 2026-10-04 ~22:00 UTC until this was found, #1171).
            # Next.js answers its first request late (cold start, port forward
            # still wiring up), so retry for up to ~60s instead of one shot.
            ok=0
            for i in $(seq 1 20); do
              if curl -sf --max-time 10 -o /dev/null http://127.0.0.1:8082/en; then ok=1; break; fi
              sleep 3
            done
            [ "$ok" = 1 ] || \
              { echo "ERROR: app not responding"; diagnose; systemctl --user status fitness-members.service --no-pager || true; podman logs fitness-members 2>/dev/null || true; exit 1; }
            echo "Health check OK"
