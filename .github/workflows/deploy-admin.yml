name: Deploy Admin

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:
    # #784: a manual run picks its GitHub environment; a push to main (no
    # input) deploys to `dev`, exactly as before.
    inputs:
      environment:
        description: GitHub environment to deploy to
        type: choice
        options: [dev, production]
        default: dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fitness-admin

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          no-cache: true
          # #1114 — NEXT_PUBLIC_APP_ENV_LABEL / NEXT_PUBLIC_APP_BRAND_NAME are the
          # browser title's environment label and brand. GitHub *variables* rather
          # than secrets (neither is one) and per environment, so a `production`
          # build cannot carry the dev title; unset, the title reads the app's own
          # role alone rather than a wrong brand.
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_APP_ENV_LABEL=${{ vars.APP_ENV_LABEL }}
            NEXT_PUBLIC_APP_BRAND_NAME=${{ vars.APP_BRAND_NAME }}

      - name: Deploy to corfront
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORFRONT_SSH_HOST }}
          username: podman
          key: ${{ secrets.CORFRONT_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            echo "${{ secrets.GHCR_PAT }}" | podman login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            AVAILABLE=$(df / --output=avail | tail -1)
            if [ "$AVAILABLE" -lt 1048576 ]; then
              echo "ERROR: Less than 1GB free on disk (${AVAILABLE}KB available). Aborting deploy."
              exit 1
            fi

            podman pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # Oscar owns the systemd unit (ports, env vars, restart policy);
            # we just refresh the image and restart it.
            if ! systemctl --user restart fitness-admin.service; then
              echo "ERROR: systemctl restart failed"
              systemctl --user status fitness-admin.service --no-pager --lines=40 || true
              journalctl --user -xeu fitness-admin.service --no-pager -n 60 || true
              podman ps -a --filter name=fitness-admin || true
              echo "--- image inspection ---"
              podman image inspect ghcr.io/${{ env.IMAGE_NAME }}:latest --format '{{.Architecture}} / {{.Os}} / cmd={{.Config.Cmd}} / entrypoint={{.Config.Entrypoint}}' || true
              echo "--- direct run: node --version ---"
              podman run --rm --entrypoint /bin/sh ghcr.io/${{ env.IMAGE_NAME }}:latest -c 'node --version && ls -la /app/apps/admin/server.js 2>&1' 2>&1 || echo "(entrypoint probe failed)"
              echo "--- direct run: actual CMD to stderr (no port, will fail on bind if reached) ---"
              timeout 5 podman run --rm ghcr.io/${{ env.IMAGE_NAME }}:latest 2>&1 | head -20 || true
              exit 1
            fi

            # Next.js answers its first request late (cold start, port forward
            # still wiring up), so retry for up to ~60s instead of one shot.
            ok=0
            for i in $(seq 1 20); do
              if curl -sf --max-time 10 -o /dev/null http://localhost:8081/en; then ok=1; break; fi
              sleep 3
            done
            [ "$ok" = 1 ] || \
              { echo "ERROR: app not responding"; systemctl --user status fitness-admin.service --no-pager || true; podman logs fitness-admin 2>/dev/null || true; exit 1; }
            echo "Health check OK"
