name: Backfill Base Exercise Descriptions

# #1608 — loads the bundled EN/ES/CA short and full descriptions onto the Base
# Exercises of a real database.
#
# The script is `api/src/scripts/backfill-exercise-descriptions.ts` (#1419) and
# the content is `api/src/data/base-exercise-descriptions.json`, compiled into
# the API image; this workflow is only how it gets *executed*, for the reason
# exercises-import.yml exists: the database is VCN-private, so a GitHub runner
# cannot reach it and the run happens on the VPS against the image deployed.
#
# It only ever fills EMPTY values (a stored value, base or translated, always
# wins), so it is safe to repeat. Dry run is the default: dispatch once with
# dry_run on, read the report, then dispatch again with it off. The report ends
# with a completeness line, and an executing run exits non-zero if any Base
# Exercise still lacks one of its six values.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose database to fill
        type: choice
        options: [dev, pro]
        default: dev
      dry_run:
        description: Print the report without writing anything
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fitness-api

jobs:
  backfill:
    name: Base Exercise descriptions
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}

    steps:
      - name: Backfill on the VPS
        uses: appleboy/ssh-action@v1
        env:
          CORDEL_FITNESS_DB_HOST: ${{ secrets.CORDEL_FITNESS_DB_HOST }}
          CORDEL_FITNESS_DB_USER: ${{ secrets.CORDEL_FITNESS_DB_USER }}
          CORDEL_FITNESS_DB_PASSWORD: ${{ secrets.CORDEL_FITNESS_DB_PASSWORD }}
          CORDEL_FITNESS_DB_NAME: ${{ secrets.CORDEL_FITNESS_DB_NAME }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ secrets.CORBACK_SSH_HOST }}
          username: podman
          key: ${{ secrets.CORBACK_SSH_PRIVATE_KEY }}
          envs: CORDEL_FITNESS_DB_HOST,CORDEL_FITNESS_DB_USER,CORDEL_FITNESS_DB_PASSWORD,CORDEL_FITNESS_DB_NAME,DRY_RUN
          command_timeout: 20m
          script: |
            set -euo pipefail

            for v in CORDEL_FITNESS_DB_HOST CORDEL_FITNESS_DB_USER \
                     CORDEL_FITNESS_DB_PASSWORD CORDEL_FITNESS_DB_NAME; do
              if [ -z "${!v:-}" ]; then
                echo "ERROR: $v is not set for this GitHub environment. Nothing was written."
                exit 1
              fi
            done

            # No `podman pull`: this runs the image that is *deployed*, so the
            # content shipped is the content in the API serving the catalogue.
            IMAGE=ghcr.io/${{ env.IMAGE_NAME }}:latest
            if ! podman image exists "$IMAGE"; then
              echo "ERROR: $IMAGE is not present on this host — deploy the API first (Deploy API workflow)."
              exit 1
            fi

            ARGS=""
            if [ "${DRY_RUN}" != "true" ]; then ARGS="--execute"; fi

            # `-e NAME` with no value copies it from this shell's environment,
            # so no value appears on podman's command line (#1192).
            export CORDEL_FITNESS_DB_HOST CORDEL_FITNESS_DB_USER CORDEL_FITNESS_DB_PASSWORD CORDEL_FITNESS_DB_NAME
            podman run --rm \
              -e CORDEL_FITNESS_DB_HOST \
              -e CORDEL_FITNESS_DB_USER \
              -e CORDEL_FITNESS_DB_PASSWORD \
              -e CORDEL_FITNESS_DB_NAME \
              "$IMAGE" \
              node dist/scripts/backfill-exercise-descriptions.js $ARGS
