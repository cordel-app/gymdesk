name: Billing Window Maintenance

# #3444: keeps the rolling window of future Scheduled Billing Events full.
# POST /billing/maintain-window delegates to the shared business logic in #3445.
# The target is TWO future positive-value Scheduled Billing Events in total
# per eligible Product Set, across all schedules — not two events per schedule.
# Each recurring line is calculated on its own schedule; obligations due on the
# same date are consolidated into one Billing Event with all applicable lines.
# Zero-value obligations do not count towards the two-event target.
#
# This is a preparation job only: it executes no charge and creates no payment
# request or attempt. It is deliberately independent of billing-run.yml:
# maintenance failures must not stop due charges, and charge-run failures must
# not stop a separately triggered maintenance run.
#
# Safe to retry and repeat: idempotency and concurrency protection are enforced
# by the API implementation. The workflow-level concurrency group below also
# prevents overlapping runs in the same environment.
on:
  schedule:
    # Run every day, before the 06:00 UTC billing execution.
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to run against
        type: choice
        options: [dev, pro]
        default: dev

concurrency:
  group: billing-window-maintenance-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  maintain-window:
    name: Rolling window maintenance
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}

    steps:
      - name: Check environment configuration
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error title=API_BASE_URL is not set::The GitHub environment this job runs in has no API_BASE_URL variable, so the rolling-window maintenance cannot know which host to call. It is the admin app's relay prefix (https://admin.<host>/api/internal). Add it under Settings -> Environments -> <this job's environment> -> Environment variables."
            exit 1
          fi
          echo "Calling $API_BASE_URL"

      - name: POST /billing/maintain-window
        env:
          BILLING_INTERNAL_SECRET: ${{ secrets.BILLING_INTERNAL_SECRET }}
        run: |
          set -euo pipefail

          rc=0
          body="$(curl -sS --fail-with-body -X POST "$API_BASE_URL/billing/maintain-window" \
            -H "X-Internal-Secret: $BILLING_INTERNAL_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 300)" || rc=$?

          printf 'POST /billing/maintain-window -> %s\n' "$body"

          # The API returns aggregate counters and a per-Product-Set target status
          # (#3444) on both complete and incomplete runs. A failure or an incomplete
          # set makes the workflow fail so the run can be retried; a shortfall
          # (the contract owes fewer future obligations) is reported, not failed.
          counters="$(printf '%s' "$body" \
            | jq -er '[.product_sets_examined, .product_sets_updated, .events_created, .failures] | map(numbers) | select(length == 4) | @tsv' 2>/dev/null)" || counters=""

          if [ -n "$counters" ]; then
            IFS=$'\t' read -r examined updated created failures <<<"$counters"
            run_date="$(printf '%s' "$body" | jq -r '.run_date // "unknown"')"
            # #3444: per-Product-Set target status, reported by the endpoint (this job computes nothing).
            at_target="$(printf '%s' "$body" | jq -r '.product_sets_at_target // 0')"
            shortfall="$(printf '%s' "$body" | jq -r '.product_sets_shortfall // 0')"
            incomplete="$(printf '%s' "$body" | jq -r '.product_sets_incomplete // 0')"
            consolidated="$(printf '%s' "$body" | jq -r '.lines_consolidated // 0')"
            zero_skipped="$(printf '%s' "$body" | jq -r '.zero_value_skipped // 0')"
            target="$(printf '%s' "$body" | jq -r '.target_events // 2')"
            echo "run_date=$run_date examined=$examined at_target=$at_target replenished=$updated events_created=$created consolidated=$consolidated zero_value_skipped=$zero_skipped shortfall=$shortfall incomplete=$incomplete failures=$failures"
            {
              echo "### Billing window maintenance ($run_date)"
              echo ""
              echo "Target: $target future positive-value Scheduled Billing Events in total per eligible Product Set, across all schedules."
              echo ""
              echo "| Examined | At target | Replenished | Events created | Lines consolidated | Zero-value skipped | Shortfall | Incomplete | Failures |"
              echo "|---|---|---|---|---|---|---|---|---|"
              echo "| $examined | $at_target | $updated | $created | $consolidated | $zero_skipped | $shortfall | $incomplete | $failures |"
              below="$(printf '%s' "$body" | jq -r '(.product_sets // [])[] | select(.status != "at_target" and .status != "replenished") | "| \(.product_set_id) | \(.gym_id) | \(.status) | \(.future_events) | \(.planned_events) | \(.events_created) | \(.reason // "") |"')"
              if [ -n "$below" ]; then
                echo ""
                echo "Product Sets below target (a shortfall is legitimate: the contract owes fewer future obligations):"
                echo ""
                echo "| Product Set | Gym | Status | Events held | Obligations planned | Events created | Reason |"
                echo "|---|---|---|---|---|---|---|"
                echo "$below"
              else
                echo ""
                echo "Every eligible Product Set holds its target."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$rc" -ne 0 ]; then
            if [ -n "$counters" ] && { [ "${failures:-0}" -gt 0 ] || [ "${incomplete:-0}" -gt 0 ]; }; then
              echo "::error title=Billing window maintenance incomplete::$failures Product Set(s) failed and $incomplete were left below their planned window; the rest were processed. Nothing was charged. Re-run this workflow to retry."
            else
              echo "::error title=Billing window maintenance did not execute::POST /billing/maintain-window failed (curl exit $rc). Check the admin relay, API and X-Internal-Secret configuration. Re-run this workflow to retry."
            fi
            exit 1
          fi

          if [ -z "$counters" ]; then
            echo "::error title=Billing window maintenance answered an unreadable body::POST /billing/maintain-window returned 2xx but did not include the expected counters."
            exit 1
          fi

          if [ "$failures" -gt 0 ]; then
            echo "::error title=$failures Product Set(s) not maintained::The run reported failures. Re-run this workflow to retry."
            exit 1
          fi

          echo "Billing window maintenance completed: $created Billing Event(s) created across $updated Product Set(s); $shortfall legitimate shortfall(s)."
