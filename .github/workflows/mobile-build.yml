name: Mobile build

# #1077 (mobile app WP5): builds the Capacitor shell (`apps/mobile`) in CI, so a
# test build is made from a commit and not on somebody's laptop.
#
#  - Android: a **debug APK** a tester can install by hand (download the artifact,
#    open it on the phone). Signed with the shared debug keystore (see the secret
#    below) so the Google sign-in client registered for its SHA-1 keeps working.
#  - iOS: an **ad-hoc signed simulator build** — a build check (kept as a workflow artifact,
#    never published to Cordel → Mobile builds), and an app for a Mac's simulator. It
#    cannot be installed on an iPhone: that needs a signed build and the Apple
#    Developer account, and an iPhone gets its builds from TestFlight
#    (`docs/go-to-production.md` §6).
#  - Android release: a **signed AAB** for Google Play (`android-release`), built only
#    on a `mobile-v*` tag or a manual run with `release: true`, never on a pull
#    request. Signed with the Play upload key from environment secrets; uploaded to
#    Play's internal track when `GOOGLE_PLAY_SERVICE_ACCOUNT_JSON` is set, and never
#    published to Cordel → Mobile builds (an AAB cannot be installed by hand).
#
# It is a manual workflow, plus tags and changes to the shell itself. macOS runners
# cost several times a Linux minute, which is why this does not run on every push.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose settings the build uses
        type: choice
        options: [dev, pro]
        default: dev
      release:
        description: Also build the signed release AAB for Google Play
        type: boolean
        default: false
  push:
    tags: ['mobile-v*']
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-build.yml'

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'dev' }}
    timeout-minutes: 30
    env:
      # Where the shell loads the Members App from, and the Google clients it is
      # built with: the same values the web build gets (`deploy-member.yml`), so
      # the app and the web it loads cannot disagree.
      # One app per environment (#1077): dev is its own app id, so it installs beside
      # the pro app instead of over it. A third environment adds a profile file.
      MOBILE_APP_PROFILE: ${{ (inputs.environment || 'dev') == 'pro' && 'cordel-fitness' || 'cordel-fitness-dev' }}
      MOBILE_SERVER_URL: ${{ vars.CORDEL_FITNESS_MEMBERS_URL }}
      MOBILE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      MOBILE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      MOBILE_ALLOW_NAVIGATION_VAR: ${{ vars.MOBILE_ALLOW_NAVIGATION }}
      # Firebase config for push (FCM): the environment's own project, never committed.
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # The Capacitor CLI refuses to run below Node 22, unlike the web apps' 20.
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build settings
        run: |
          # `MOBILE_ALLOW_NAVIGATION` is exported only when set: an empty value is
          # read as "an empty list" and would blank the profile's own, which is
          # the hosts the sign-in is allowed to move through (the Clerk host).
          if [ -n "$MOBILE_ALLOW_NAVIGATION_VAR" ]; then
            echo "MOBILE_ALLOW_NAVIGATION=$MOBILE_ALLOW_NAVIGATION_VAR" >> "$GITHUB_ENV"
          else
            echo "::warning::No MOBILE_ALLOW_NAVIGATION variable in this environment; the shell will allow only its own host, so a Clerk sign-in that redirects through Clerk's host will open Safari/Chrome instead."
          fi

      - name: Debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            # AGP reads the debug key from the Android user home, which an env
            # variable can move; write the same file there too.
            for dir in "${ANDROID_USER_HOME:-}" "${ANDROID_SDK_HOME:-}"; do
              if [ -n "$dir" ]; then mkdir -p "$dir" && cp "$HOME/.android/debug.keystore" "$dir/debug.keystore"; fi
            done
            EXPECTED=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep 'SHA1:' | head -1 | sed 's/.*SHA1: //' | tr -d ':' | tr 'A-F' 'a-f')
            echo "EXPECTED_SIGNER_SHA1=$EXPECTED" >> "$GITHUB_ENV"
            echo "Restored debug keystore, SHA-1 ${EXPECTED:-unreadable}; ANDROID_USER_HOME=${ANDROID_USER_HOME:-unset} ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-unset}"
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE_B64 secret: Gradle will create a new debug key, whose SHA-1 is not the one registered for Google sign-in."
          fi

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Version
        run: |
          # The version people read (`apps/mobile/package.json`) and the number that
          # tells two builds of it apart (the workflow's own run number, which only
          # ever goes up — what Play's versionCode and iOS's build number need).
          echo "BUILD_VERSION=$(node -p "require('./apps/mobile/package.json').version")" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Firebase config
        working-directory: apps/mobile
        run: |
          # profile:apply copies profiles/<profile>/google-services.json into the
          # Android project; without it the shell has no push (MainActivity's placeholder).
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            mkdir -p "profiles/$MOBILE_APP_PROFILE"
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > "profiles/$MOBILE_APP_PROFILE/google-services.json"
            echo "google-services.json written for $MOBILE_APP_PROFILE"
          else
            echo "::warning::No GOOGLE_SERVICES_JSON_B64 in this environment: the app is built without push."
          fi

      - name: Apply the app profile and sync
        working-directory: apps/mobile
        run: |
          npm run profile:apply
          npx cap sync android

      - name: Build the debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon -PversionName="$BUILD_VERSION" -PversionCode="$BUILD_NUMBER"

      - name: Name and describe the APK
        id: apk
        run: |
          SRC=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ENV_NAME="${{ inputs.environment || 'dev' }}"
          NAME="cordel-fitness-${ENV_NAME}-${BUILD_VERSION}-b${BUILD_NUMBER}-${GITHUB_SHA::8}.apk"
          cp "$SRC" "$NAME"
          # Gradle's debug signing picked its own key in CI even with the shared
          # keystore in place, so the APK is signed explicitly with it instead.
          if [ -n "${EXPECTED_SIGNER_SHA1:-}" ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android "$NAME"
          fi
          SIGNER=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$NAME" | grep 'SHA-1' | head -1 | sed 's/.*: //')
          SIZE=$(du -h "$NAME" | cut -f1)
          # The keystore secret exists to keep the signer stable. If it was restored
          # and the APK is signed with something else, fail here rather than hand
          # out a build whose Google sign-in is refused.
          if [ -n "${EXPECTED_SIGNER_SHA1:-}" ] && [ "$(echo "$SIGNER" | tr -d ':' | tr 'A-F' 'a-f')" != "$EXPECTED_SIGNER_SHA1" ]; then
            echo "::error::The APK is signed with $SIGNER, not the restored debug keystore ($EXPECTED_SIGNER_SHA1)."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "signer=$(echo "$SIGNER" | tr -d ':' | tr 'A-F' 'a-f')" >> "$GITHUB_OUTPUT"
          {
            echo "### Android debug APK"
            echo "- File: \`$NAME\` ($SIZE)"
            echo "- Version: \`$BUILD_VERSION\` (build \`$BUILD_NUMBER\`)"
            echo "- App: \`$(node -p "require('./apps/mobile/profiles/$MOBILE_APP_PROFILE.json').appId")\` (profile \`$MOBILE_APP_PROFILE\`)"
            echo "- Environment: \`$ENV_NAME\` (loads \`$MOBILE_SERVER_URL\`)"
            echo "- Signer SHA-1: \`$SIGNER\` — must be the one registered in the Google Android OAuth client"
            echo "- Install: download the artifact below, unzip, open the APK on the phone (allow installs from that app)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      # Not on a pull request: a PR's build is for its own review, and listing every
      # one would bury the builds a tester should pick.
      - name: Publish to Cordel → Mobile builds
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          BUILD_FILE: ${{ steps.apk.outputs.name }}
          BUILD_PLATFORM: android
          SIGNER_SHA1: ${{ steps.apk.outputs.signer }}
          ENV_NAME: ${{ inputs.environment || 'dev' }}
          VERSION: ${{ env.BUILD_VERSION }}
          GIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export APP_ID="$(node -p "require('./apps/mobile/profiles/$MOBILE_APP_PROFILE.json').appId")"
          export APP_NAME="$(node -p "require('./apps/mobile/profiles/$MOBILE_APP_PROFILE.json').appName")"
          bash .github/scripts/publish-mobile-build.sh

  android-release:
    name: Android release AAB (signed)
    # Never on a pull request: this job holds the Play upload key. Only a
    # `mobile-v*` tag or a manual run that asks for it builds a release.
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/mobile-v') || inputs.release)
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'dev' }}
    timeout-minutes: 30
    env:
      MOBILE_APP_PROFILE: ${{ (inputs.environment || 'dev') == 'pro' && 'cordel-fitness' || 'cordel-fitness-dev' }}
      MOBILE_SERVER_URL: ${{ vars.CORDEL_FITNESS_MEMBERS_URL }}
      MOBILE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      MOBILE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      MOBILE_ALLOW_NAVIGATION_VAR: ${{ vars.MOBILE_ALLOW_NAVIGATION }}
      # Firebase config for push (FCM): the environment's own project, never committed.
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      # The Play upload key (docs/mobile-runbook.md, "Release builds for Google Play").
      ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      ANDROID_UPLOAD_KEY_SHA256: ${{ secrets.ANDROID_UPLOAD_KEY_SHA256 }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build settings
        run: |
          if [ -n "$MOBILE_ALLOW_NAVIGATION_VAR" ]; then
            echo "MOBILE_ALLOW_NAVIGATION=$MOBILE_ALLOW_NAVIGATION_VAR" >> "$GITHUB_ENV"
          else
            echo "::warning::No MOBILE_ALLOW_NAVIGATION variable in this environment; the shell will allow only its own host."
          fi

      - name: Upload key
        run: |
          # A release build with no upload key would be an unsigned AAB that Play
          # refuses; fail here, before anything is built.
          for name in ANDROID_UPLOAD_KEYSTORE_B64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD ANDROID_UPLOAD_KEY_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name in the '${{ inputs.environment || 'dev' }}' environment (docs/mobile-runbook.md, \"Release builds for Google Play\")."
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/upload.keystore"
          echo "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Version
        run: |
          # Same workflow as the debug build, so the run number (Play's versionCode)
          # only ever goes up across debug and release builds alike.
          echo "BUILD_VERSION=$(node -p "require('./apps/mobile/package.json').version")" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "APP_ID=$(node -p "require('./apps/mobile/profiles/$MOBILE_APP_PROFILE.json').appId")" >> "$GITHUB_ENV"

      - name: Firebase config
        working-directory: apps/mobile
        run: |
          # profile:apply copies profiles/<profile>/google-services.json into the
          # Android project; without it the shell has no push (MainActivity's placeholder).
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            mkdir -p "profiles/$MOBILE_APP_PROFILE"
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > "profiles/$MOBILE_APP_PROFILE/google-services.json"
            echo "google-services.json written for $MOBILE_APP_PROFILE"
          else
            echo "::warning::No GOOGLE_SERVICES_JSON_B64 in this environment: the app is built without push."
          fi

      - name: Apply the app profile and sync
        working-directory: apps/mobile
        run: |
          npm run profile:apply
          npx cap sync android

      - name: Build the release AAB
        working-directory: apps/mobile/android
        run: ./gradlew bundleRelease --no-daemon -PversionName="$BUILD_VERSION" -PversionCode="$BUILD_NUMBER"

      - name: Check the signer and describe the AAB
        id: aab
        run: |
          SRC=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          ENV_NAME="${{ inputs.environment || 'dev' }}"
          NAME="cordel-fitness-${ENV_NAME}-${BUILD_VERSION}-b${BUILD_NUMBER}-${GITHUB_SHA::8}.aab"
          cp "$SRC" "$NAME"
          CERT=$(keytool -printcert -jarfile "$NAME")
          SHA1=$(echo "$CERT" | grep 'SHA1:' | head -1 | sed 's/.*SHA1: //')
          SHA256=$(echo "$CERT" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          norm() { echo "$1" | tr -d ': ' | tr 'A-F' 'a-f'; }
          # Play accepts an upload only when it is signed with the registered upload
          # key; catch a wrong or missing signature here, not in the Play Console.
          if [ -z "$SHA256" ] || [ "$(norm "$SHA256")" != "$(norm "$ANDROID_UPLOAD_KEY_SHA256")" ]; then
            echo "::error::The AAB is signed with '${SHA256:-nothing}', not the upload key in ANDROID_UPLOAD_KEY_SHA256."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "### Android release AAB"
            echo "- File: \`$NAME\` ($(du -h "$NAME" | cut -f1))"
            echo "- Version: \`$BUILD_VERSION\` (versionCode \`$BUILD_NUMBER\`)"
            echo "- App: \`$APP_ID\` (profile \`$MOBILE_APP_PROFILE\`), environment \`$ENV_NAME\` (loads \`$MOBILE_SERVER_URL\`)"
            echo "- Upload key SHA-1: \`$SHA1\`"
            echo "- Upload key SHA-256: \`$SHA256\`"
            echo "- Google sign-in and App Links need Play App Signing's fingerprints too (Play Console → App integrity), not only these."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.aab.outputs.name }}
          path: ${{ steps.aab.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: No Play service account
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON == ''
        run: echo "::warning::No GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret in this environment; the AAB is kept as a workflow artifact and not uploaded to Google Play."

      # Internal track only. A Play app that has never been published accepts only
      # draft releases, so the status is `draft` until GOOGLE_PLAY_RELEASE_STATUS says otherwise.
      - name: Upload to Google Play (internal track)
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_ID }}
          releaseFiles: ${{ steps.aab.outputs.name }}
          track: internal
          status: ${{ vars.GOOGLE_PLAY_RELEASE_STATUS || 'draft' }}

  ios-simulator:
    name: iOS simulator build (ad-hoc signed)
    runs-on: macos-latest
    environment: ${{ inputs.environment || 'dev' }}
    timeout-minutes: 45
    env:
      # One app per environment (#1077): dev is its own app id, so it installs beside
      # the pro app instead of over it. A third environment adds a profile file.
      MOBILE_APP_PROFILE: ${{ (inputs.environment || 'dev') == 'pro' && 'cordel-fitness' || 'cordel-fitness-dev' }}
      MOBILE_SERVER_URL: ${{ vars.CORDEL_FITNESS_MEMBERS_URL }}
      MOBILE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      MOBILE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      MOBILE_ALLOW_NAVIGATION_VAR: ${{ vars.MOBILE_ALLOW_NAVIGATION }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # The Capacitor CLI refuses to run below Node 22, unlike the web apps' 20.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build settings
        run: |
          if [ -n "$MOBILE_ALLOW_NAVIGATION_VAR" ]; then
            echo "MOBILE_ALLOW_NAVIGATION=$MOBILE_ALLOW_NAVIGATION_VAR" >> "$GITHUB_ENV"
          else
            echo "::warning::No MOBILE_ALLOW_NAVIGATION variable in this environment; the shell will allow only its own host."
          fi

      - name: Version
        run: |
          # The version people read (`apps/mobile/package.json`) and the number that
          # tells two builds of it apart (the workflow's own run number, which only
          # ever goes up — what Play's versionCode and iOS's build number need).
          echo "BUILD_VERSION=$(node -p "require('./apps/mobile/package.json').version")" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Apply the app profile and sync
        working-directory: apps/mobile
        run: |
          npm run profile:apply
          npx cap sync ios

      - name: Build for the simulator
        working-directory: apps/mobile
        run: |
          # Ad-hoc signed (`CODE_SIGN_IDENTITY=-`), never `CODE_SIGNING_ALLOWED=NO`: that
          # embeds no entitlements, so the app has no `keychain-access-groups` and Google
          # Sign-In fails in the simulator with `keychain error` (docs/mobile-app.md §3).
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            MARKETING_VERSION="$BUILD_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Package the .app
        id: app
        run: |
          NAME="cordel-fitness-${{ inputs.environment || 'dev' }}-${BUILD_VERSION}-b${BUILD_NUMBER}-${GITHUB_SHA::8}-ios-simulator.zip"
          ditto -c -k --keepParent apps/mobile/build/Build/Products/Debug-iphonesimulator/App.app "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "### iOS simulator build (ad-hoc signed)"
            echo "- File: \`$NAME\` ($(du -h "$NAME" | cut -f1))"
            echo "- Version: \`$BUILD_VERSION\` (build \`$BUILD_NUMBER\`)"
            echo "- Runs in a Mac's iOS Simulator only. It cannot be installed on an iPhone (needs a signed build and an Apple Developer account)."
            APP_ID=$(node -p "require('./apps/mobile/profiles/$MOBILE_APP_PROFILE.json').appId")
            echo "- App: \`$APP_ID\` (profile \`$MOBILE_APP_PROFILE\`)"
            echo "- Try it: \`unzip\`, then \`xcrun simctl install booted App.app && xcrun simctl launch booted $APP_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.name }}
          path: ${{ steps.app.outputs.name }}
          if-no-files-found: error
          retention-days: 14
