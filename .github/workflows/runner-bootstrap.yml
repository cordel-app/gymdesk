name: Runner bootstrap (TEMPORARY)

# TEMPORARY (#2042/#2043): installs the self-hosted runner on a VPS over the
# existing SSH secrets. Removed in #2046 together with the SSH access. The
# registration token comes from the repo secret RUNNER_REG_TOKEN (masked in
# logs), set just before a run and deleted right after. workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      host:
        description: Runner host
        type: choice
        options: [corfront, corback]
        required: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Pack the install script
        run: echo "SCRIPT_B64=$(base64 -w0 infra/runner/install-runner.sh)" >> "$GITHUB_ENV"

      - name: Install runner on ${{ inputs.host }}
        uses: appleboy/ssh-action@v1
        env:
          RUNNER_TOKEN: ${{ secrets.RUNNER_REG_TOKEN }}
          RUNNER_HOST: ${{ inputs.host }}
          RUNNER_ENV: dev
          SCRIPT_B64: ${{ env.SCRIPT_B64 }}
        with:
          host: ${{ inputs.host == 'corback' && secrets.CORBACK_SSH_HOST || secrets.CORFRONT_SSH_HOST }}
          username: podman
          key: ${{ inputs.host == 'corback' && secrets.CORBACK_SSH_PRIVATE_KEY || secrets.CORFRONT_SSH_PRIVATE_KEY }}
          envs: RUNNER_TOKEN,RUNNER_HOST,RUNNER_ENV,SCRIPT_B64
          script: |
            set -euo pipefail
            echo "$SCRIPT_B64" | base64 -d > /tmp/install-runner.sh
            bash /tmp/install-runner.sh
            rm -f /tmp/install-runner.sh
