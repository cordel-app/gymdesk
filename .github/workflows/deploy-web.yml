name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy to
        type: choice
        options: [dev, pro]
        default: dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cordel-web

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The pages carry [[FILL-IN]] markers for the holder's details. A site
      # that still has one must never reach corfront.
      - name: Refuse unfilled placeholders
        run: |
          if grep -rn '\[\[' apps/web --include='*.html'; then
            echo "ERROR: apps/web still has [[...]] placeholders (holder name, NIF, address, email)."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          no-cache: true

  # The deploy runs on the self-hosted runner on corfront (outbound-only agent;
  # no SSH, #2044). Only a workflow that no pull request can trigger may use it
  # (api/src/test/self-hosted-runner-guard.unit.test.ts).
  deploy:
    name: Deploy
    needs: build
    runs-on: [self-hosted, corfront, "${{ inputs.environment || 'dev' }}"]
    environment: ${{ inputs.environment || 'dev' }}
    permissions: {}

    steps:
      - name: Deploy to corfront
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
            set -euo pipefail

            echo "$GHCR_PAT" | podman login ghcr.io -u "$GHCR_USER" --password-stdin

            # Dangling images only (see deploy-payment.yml): the host is shared
            # with the other corfront apps and a tagged or running image is never
            # touched.
            podman image prune -f || true

            AVAILABLE=$(df / --output=avail | tail -1)
            if [ "$AVAILABLE" -lt 1048576 ]; then
              echo "ERROR: Less than 1GB free on disk (${AVAILABLE}KB available). Aborting deploy."
              exit 1
            fi

            podman pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            UNIT="$HOME/.config/containers/systemd/cordel-web.container"
            if [ ! -f "$UNIT" ]; then
              echo "ERROR: Oscar's quadlet is missing at $UNIT"
              echo "Create it from infra/web/cordel-web.container (Image=ghcr.io/${{ env.IMAGE_NAME }}:latest, PublishPort=8084:80)"
              echo "then: systemctl --user daemon-reload && systemctl --user start cordel-web"
              exit 1
            fi

            # The site has no runtime environment: the unit is Oscar's as it is.
            if ! systemctl --user restart cordel-web.service; then
              echo "ERROR: systemctl restart failed"
              systemctl --user status cordel-web.service --no-pager --lines=40 || true
              journalctl --user -xeu cordel-web.service --no-pager -n 60 || true
              podman ps -a --filter name=cordel-web || true
              exit 1
            fi

            # 127.0.0.1, never `localhost`: on corfront `localhost` resolves to ::1
            # first and the connection is reset (#1171).
            sleep 3
            curl -sf --max-time 10 -o /dev/null http://127.0.0.1:8084/ || \
              { echo "ERROR: web not responding on :8084"; ss -tlnp 2>/dev/null | grep ':8084' || echo "nothing listening on :8084"; podman port cordel-web 2>&1 || true; podman logs cordel-web 2>/dev/null | tail -40 || true; exit 1; }
            curl -sf --max-time 10 -o /dev/null http://127.0.0.1:8084/legal || \
              { echo "ERROR: legal notice not served"; exit 1; }
            echo "Health check OK"
