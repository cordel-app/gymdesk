name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    environment: dev
    # The suite is split in three. Each shard is its own job with its own MySQL
    # service container, so no shard can see another's rows: that is what makes
    # `fileParallelism: false` + shared-DB assumptions still hold inside one.
    # A test file therefore must not depend on data written by another file.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: fitness
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Migrations run against a throwaway MySQL service container — the real
      # HeatWave DB is VCN-private and unreachable from CI runners.
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/fitness
      CORDEL_FITNESS_DB_HOST: 127.0.0.1:3306
      CORDEL_FITNESS_DB_USER: root
      CORDEL_FITNESS_DB_PASSWORD: ci
      CORDEL_FITNESS_DB_NAME: fitness
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      PORT: 3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        working-directory: api
        run: npx tsc --noEmit

      - name: Run migrations
        working-directory: api
        run: npm run db:migrate

      - name: Run tests (shard ${{ matrix.shard }}/3)
        working-directory: api
        run: npx vitest run --shard=${{ matrix.shard }}/3

  admin:
    name: Admin
    runs-on: ubuntu-24.04
    environment: dev
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /en/sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /en/sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /en
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /en

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        working-directory: apps/admin
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/admin
        run: npm run build

  payment:
    name: Payment page
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build nginx image
        run: docker build -f apps/payment/Dockerfile -t fitness-pay:ci apps/payment
