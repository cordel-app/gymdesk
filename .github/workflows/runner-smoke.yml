name: Runner smoke test

# Manual check that a self-hosted runner works (#2042 corfront, #2043 corback).
# workflow_dispatch only: a pull request must never be able to run on a
# self-hosted runner (api/src/test/self-hosted-runner-guard.unit.test.ts).

on:
  workflow_dispatch:
    inputs:
      host:
        description: Runner host
        type: choice
        options: [corfront, corback]
        required: true

jobs:
  smoke:
    runs-on: [self-hosted, "${{ inputs.host }}", dev]
    environment: dev
    steps:
      - name: Runner identity
        run: |
          whoami
          podman --version
          systemctl --user is-system-running || true

      # corback only: what the API deploy needs (#2043).
      - name: GHCR login
        if: inputs.host == 'corback'
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          echo "$GHCR_PAT" | podman login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Database reachable
        if: inputs.host == 'corback'
        env:
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
        run: |
          # HeatWave is VCN-private; migrations run from this host with
          # DATABASE_URL_MIGRATIONS, so check the very host:port it names.
          # Nothing from the URL is printed.
          rest="${DATABASE_URL_MIGRATIONS#*://}"
          rest="${rest##*@}"
          hostport="${rest%%/*}"
          hostport="${hostport%%\?*}"
          DB_HOST="${hostport%%:*}"
          DB_PORT="3306"
          case "$hostport" in *:*) DB_PORT="${hostport##*:}";; esac
          export DB_HOST DB_PORT
          timeout 10 bash -c 'exec 3<>"/dev/tcp/$DB_HOST/$DB_PORT"' \
            && echo "Database reachable from this host" \
            || { echo "ERROR: cannot reach the database named by DATABASE_URL_MIGRATIONS"; exit 1; }
