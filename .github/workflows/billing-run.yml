name: Billing Run

on:
  schedule:
    # 06:00 UTC = 07:00 CET (08:00 CEST)
    - cron: '0 6 * * *'
    # #781: a second attempt, four hours later, as a safety net for a 06:00 run
    # GitHub delayed past usefulness or dropped entirely (scheduled workflows are
    # best-effort and are shed under load). 10:00 UTC is inside the gyms' working
    # day, so a charge that lands here is still same-day, and it is well clear of
    # the 03:00 recurring booking run. On a normal day this attempt charges
    # nobody: #780's guard answers `200 { skipped_reason:
    # 'already_completed_today', … }`, which the step below reports as a green
    # no-op. Only the day the 06:00 run never completed does this become the
    # real run, judged by #778's rules like any other.
    - cron: '0 10 * * *'
  workflow_dispatch:
    # #784: a manual run picks its GitHub environment (and therefore the API it
    # calls and the secret it sends). It defaults to `dev`, so a dispatch nobody
    # thought about never charges real members.
    inputs:
      environment:
        description: GitHub environment to run against
        type: choice
        options: [dev, production]
        default: dev

# #778: this workflow is the alerting channel for the nightly run, not only its
# trigger. `curl -sf` alone fails on a non-2xx status, and `POST /billing/run`
# answers `200 { processed, succeeded, failed, waived }` even when every charge
# was rejected — so a night nobody could be charged looked exactly like a night
# everybody was, and the only trace was a `failed_billing` row somebody had to
# go and read. Every step below therefore reads the response body and exits
# non-zero when the run did not do its job: a red run is the notification, and
# it reaches whoever GitHub notifies for this environment.

jobs:
  billing-run:
    name: MIT billing run
    runs-on: ubuntu-latest
    # #784: a manual run uses the environment it was dispatched with; a
    # scheduled run has no inputs and falls back to the literal below.
    # #784: switch to 'production' once the environment exists
    environment: ${{ inputs.environment || 'dev' }}
    env:
      # #784: the host is the selected environment's `API_BASE_URL` variable
      # (a variable, not a secret: a hostname is not a credential, and seeing it
      # in the log is how a run that hit the wrong API gets diagnosed).
      API_BASE_URL: ${{ vars.API_BASE_URL }}

    steps:
      - name: Check environment configuration
        id: config
        run: |
          set -euo pipefail
          # No hardcoded fallback: a run that would silently call some default
          # host is worse than one that goes red and says what is missing. (The
          # environment's name is deliberately not repeated here — the `environment:`
          # line above is the one place that decides it; the job header shows it.)
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error title=API_BASE_URL is not set::The GitHub environment this job runs in has no API_BASE_URL variable, so the billing run cannot know which API to call — no membership was charged. Add it under Settings -> Environments -> <this job's environment> -> Environment variables (#784)."
            exit 1
          fi
          echo "Calling $API_BASE_URL"

      - name: POST /billing/run
        env:
          BILLING_INTERNAL_SECRET: ${{ secrets.BILLING_INTERNAL_SECRET }}
        run: |
          set -euo pipefail

          # `--fail-with-body` keeps `curl -f`'s non-2xx failure while still
          # printing what the API said. Since #780 the only 429 left is "a run
          # is genuinely in progress right now", which with these schedules
          # means two triggers overlapped or a run is wedged — a person should
          # look, so it stays a failure. "Today's run already completed" is no
          # longer a 429: it answers 200 with `skipped_reason`, handled below.
          rc=0
          body="$(curl -sS --fail-with-body -X POST "$API_BASE_URL/billing/run" \
            -H "X-Internal-Secret: $BILLING_INTERNAL_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 120)" || rc=$?

          printf 'POST /billing/run -> %s\n' "$body"

          if [ "$rc" -ne 0 ]; then
            echo "::error title=Billing run did not execute::POST /billing/run failed (curl exit $rc) — no membership was charged. Check the API, the X-Internal-Secret pair, the nginx GitHub Actions allowlist, and whether a run is still in progress (#780: a completed run for today answers 200, not a failure)."
            exit 1
          fi

          # A body with no counters (HTML error page, empty answer, a renamed
          # field) is a failure too: a run whose outcome cannot be read is not a
          # run that is known to have worked.
          if ! counters="$(printf '%s' "$body" \
            | jq -er '[.processed, .succeeded, .failed, .waived] | map(numbers) | select(length == 4) | @tsv')"; then
            echo "::error title=Billing run answered an unreadable body::POST /billing/run returned 2xx but carried no processed/succeeded/failed/waived counters. The body is in the step log."
            exit 1
          fi

          # #780: an attempt that found today's run already completed is a
          # no-op, not a night that went wrong. The 10:00 UTC safety net (#781)
          # hits this every day the 06:00 run worked, so it has to be green —
          # and it must not be reported as "completed with no failed charges",
          # which would hide a first attempt that never ran.
          skip="$(printf '%s' "$body" | jq -r '.skipped_reason // empty')"
          if [ -n "$skip" ]; then
            run_date="$(printf '%s' "$body" | jq -r '.run_date // "unknown"')"
            echo "Billing run skipped ($skip) — a run already completed for $run_date. Nothing to do."
            exit 0
          fi

          IFS=$'\t' read -r processed succeeded failed waived <<<"$counters"

          # #785: how many assignments this run escalated to `paused` after a
          # second consecutive rejection. Read defensively (`// 0`) rather than
          # through the parse above: an API that predates the counter must not
          # turn a readable run into an unreadable one mid-deploy.
          paused="$(printf '%s' "$body" | jq -r '.paused // 0')"
          echo "processed=$processed succeeded=$succeeded failed=$failed waived=$waived paused=$paused"

          if [ "$failed" -gt 0 ]; then
            echo "::error title=$failed failed recurring charge(s)::The nightly run could not charge $failed of $processed due membership(s). Open Payments -> Billing Events with the status filter set to 'failed' (oldest first) to see which members and why."
            if [ "$paused" -gt 0 ]; then
              # A pause is always accompanied by the rejection that caused it, so
              # this never needs to fail the step on its own — but it is the part
              # a person has to act on: those members are no longer being billed
              # and staff must reactivate them explicitly once they have paid.
              echo "::error title=$paused assigned plan(s) paused::A second consecutive rejection paused $paused assigned plan(s) (#785). They are no longer selected by the run. Settle the failed charge (Retry Payment or Manual payment) and reactivate each one explicitly from its Assigned Plan."
            fi
            exit 1
          fi

          # processed=0 is a normal night: nothing was due.
          echo 'Billing run completed with no failed charges.'

      - name: POST /billing/cleanup
        # Expiring stale pending payment requests is unrelated to the charge
        # outcome, so it must still run when the step above went red — but not
        # when there is no API to call (#784: the configuration check failed).
        if: ${{ !cancelled() && steps.config.outcome == 'success' }}
        env:
          BILLING_INTERNAL_SECRET: ${{ secrets.BILLING_INTERNAL_SECRET }}
        run: |
          set -euo pipefail

          rc=0
          body="$(curl -sS --fail-with-body -X POST "$API_BASE_URL/billing/cleanup" \
            -H "X-Internal-Secret: $BILLING_INTERNAL_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 30)" || rc=$?

          printf 'POST /billing/cleanup -> %s\n' "$body"

          if [ "$rc" -ne 0 ]; then
            echo "::error title=Billing cleanup did not execute::POST /billing/cleanup failed (curl exit $rc). Stale pending payment requests were not expired."
            exit 1
          fi

          if ! expired="$(printf '%s' "$body" | jq -er '.expired | numbers')"; then
            echo "::error title=Billing cleanup answered an unreadable body::POST /billing/cleanup returned 2xx but carried no expired counter. The body is in the step log."
            exit 1
          fi

          echo "expired=$expired stale pending payment request(s)."
