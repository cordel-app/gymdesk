name: Purge legacy exercise media

# #1420 (last stage) — removes the legacy exercise media objects (the 2048 PNG
# pair, the MP4 + 512 PNG poster) from the bucket once the gender-specific WebP
# media has replaced them. The existing media is test data and nothing is
# migrated, so these objects are dead weight after migration 277 drops the
# columns that pointed at them.
#
# The script is `api/src/scripts/purge-legacy-exercise-media.ts`; this workflow
# is only how it gets *executed* against a real bucket, from the VPS, for the
# reason `exercises-import.yml` runs there (the database is VCN-private and the
# R2 credentials live with the deployed API). It decides from object keys alone,
# so it runs before or after the migration and a second run finds nothing.
#
# Manual dispatch only, never a schedule, and a **dry run by default**: a dispatch
# nobody thought about should report, not delete.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose bucket to purge
        type: choice
        options: [dev, pro]
        default: dev
      dry_run:
        description: List what would be deleted without deleting anything
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fitness-api

jobs:
  purge:
    name: Purge legacy exercise media
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}

    steps:
      - name: Purge on the VPS
        uses: appleboy/ssh-action@v1
        # The runtime DB variables (the script lists the gyms' folder prefixes)
        # and the R2 ones (it lists and deletes objects) — the same names the API
        # is deployed with.
        env:
          CORDEL_FITNESS_DB_HOST: ${{ secrets.CORDEL_FITNESS_DB_HOST }}
          CORDEL_FITNESS_DB_USER: ${{ secrets.CORDEL_FITNESS_DB_USER }}
          CORDEL_FITNESS_DB_PASSWORD: ${{ secrets.CORDEL_FITNESS_DB_PASSWORD }}
          CORDEL_FITNESS_DB_NAME: ${{ secrets.CORDEL_FITNESS_DB_NAME }}
          CLOUDFLARE_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ secrets.CORBACK_SSH_HOST }}
          username: podman
          key: ${{ secrets.CORBACK_SSH_PRIVATE_KEY }}
          envs: CORDEL_FITNESS_DB_HOST,CORDEL_FITNESS_DB_USER,CORDEL_FITNESS_DB_PASSWORD,CORDEL_FITNESS_DB_NAME,CLOUDFLARE_R2_ENDPOINT,CLOUDFLARE_R2_ACCESS_KEY_ID,CLOUDFLARE_R2_SECRET_ACCESS_KEY,CLOUDFLARE_R2_BUCKET,CLOUDFLARE_R2_PUBLIC_URL,DRY_RUN
          command_timeout: 20m
          script: |
            set -euo pipefail

            for v in CORDEL_FITNESS_DB_HOST CORDEL_FITNESS_DB_USER \
                     CORDEL_FITNESS_DB_PASSWORD CORDEL_FITNESS_DB_NAME \
                     CLOUDFLARE_R2_ENDPOINT CLOUDFLARE_R2_ACCESS_KEY_ID \
                     CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_BUCKET; do
              if [ -z "${!v:-}" ]; then
                echo "ERROR: $v is not set for this GitHub environment. Nothing was purged."
                exit 1
              fi
            done

            # Deliberately no `podman pull`: this runs the image that is
            # *deployed*, so what deletes objects is the code serving the API.
            IMAGE=ghcr.io/${{ env.IMAGE_NAME }}:latest
            if ! podman image exists "$IMAGE"; then
              echo "ERROR: $IMAGE is not present on this host — deploy the API first (Deploy API workflow)."
              exit 1
            fi

            ARGS=""
            if [ "${DRY_RUN}" != "true" ]; then ARGS="--execute"; fi

            # `-e NAME` with no value copies it from this shell's environment, so
            # no value — the credentials above all — appears on podman's command
            # line, which journald records and ships to Loki (#1192).
            export CORDEL_FITNESS_DB_HOST CORDEL_FITNESS_DB_USER CORDEL_FITNESS_DB_PASSWORD CORDEL_FITNESS_DB_NAME
            export CLOUDFLARE_R2_ENDPOINT CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY
            export CLOUDFLARE_R2_BUCKET CLOUDFLARE_R2_PUBLIC_URL
            podman run --rm \
              -e CORDEL_FITNESS_DB_HOST \
              -e CORDEL_FITNESS_DB_USER \
              -e CORDEL_FITNESS_DB_PASSWORD \
              -e CORDEL_FITNESS_DB_NAME \
              -e CLOUDFLARE_R2_ENDPOINT \
              -e CLOUDFLARE_R2_ACCESS_KEY_ID \
              -e CLOUDFLARE_R2_SECRET_ACCESS_KEY \
              -e CLOUDFLARE_R2_BUCKET \
              -e CLOUDFLARE_R2_PUBLIC_URL \
              "$IMAGE" \
              node dist/scripts/purge-legacy-exercise-media.js $ARGS
