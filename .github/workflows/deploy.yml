name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    # #784: a manual run picks its GitHub environment; a push to main (no
    # input) deploys to `dev`, exactly as before.
    inputs:
      environment:
        description: GitHub environment to deploy to
        type: choice
        options: [dev, pro]
        default: dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fitness-api

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: write

    steps:
      # The payment flow's public URLs are per-environment configuration, not
      # code: a literal here would send a production deploy's checkout pages,
      # webhooks and success/error redirects to the dev hosts. Checked before
      # anything is built so a missing variable fails fast and deploys nothing.
      - name: Check environment configuration
        env:
          PAYMENT_PAGE_URL: ${{ vars.PAYMENT_PAGE_URL }}
          PAYMENT_NOTIFICATION_URL: ${{ vars.PAYMENT_NOTIFICATION_URL }}
          PAYMENT_OK_URL: ${{ vars.PAYMENT_OK_URL }}
          PAYMENT_KO_URL: ${{ vars.PAYMENT_KO_URL }}
        run: |
          missing=""
          for name in PAYMENT_PAGE_URL PAYMENT_NOTIFICATION_URL PAYMENT_OK_URL PAYMENT_KO_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing environment variables::The GitHub environment this job runs in is missing:$missing. Add them under Settings -> Environments -> <this job's environment> -> Environment variables. Nothing was deployed."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          no-cache: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        # Runtime env is the SINGLE SOURCE OF TRUTH in GitHub: these secrets/vars
        # are written as inline Environment= lines in the fitness-api.container
        # quadlet unit on the VPS, regenerated on every deploy (see script).
        # To change a value, edit it in GitHub → Settings → Environments → <env>.
        # Never hand-edit env on the VPS.
        env:
          APP_NODE_ENV: production
          APP_PORT: "3000"
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          CORDEL_FITNESS_DB_HOST: ${{ secrets.CORDEL_FITNESS_DB_HOST }}
          CORDEL_FITNESS_DB_USER: ${{ secrets.CORDEL_FITNESS_DB_USER }}
          CORDEL_FITNESS_DB_PASSWORD: ${{ secrets.CORDEL_FITNESS_DB_PASSWORD }}
          CORDEL_FITNESS_DB_NAME: ${{ secrets.CORDEL_FITNESS_DB_NAME }}
          CORDEL_FITNESS_ADMIN_URL: ${{ vars.CORDEL_FITNESS_ADMIN_URL }}
          CORDEL_FITNESS_MEMBERS_URL: ${{ vars.CORDEL_FITNESS_MEMBERS_URL }}
          CLOUDFLARE_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
          PAYMENT_PROVIDER: monei
          PAYMENT_PAGE_URL: ${{ vars.PAYMENT_PAGE_URL }}
          PAYMENT_NOTIFICATION_URL: ${{ vars.PAYMENT_NOTIFICATION_URL }}
          PAYMENT_OK_URL: ${{ vars.PAYMENT_OK_URL }}
          PAYMENT_KO_URL: ${{ vars.PAYMENT_KO_URL }}
          MONEI_API_KEY: ${{ secrets.MONEI_API_KEY }}
          MONEI_WEBHOOK_SECRET: ${{ secrets.MONEI_WEBHOOK_SECRET }}
          MONEI_ACCOUNT_ID: ${{ vars.MONEI_ACCOUNT_ID }}
          # The API side of the internal-run shared secrets (billing-run.yml and
          # recurring-booking-run.yml send the same environment's copies). Without
          # them every POST /billing/run and /recurring-bookings/run answers 401.
          BILLING_INTERNAL_SECRET: ${{ secrets.BILLING_INTERNAL_SECRET }}
          RECURRING_BOOKINGS_INTERNAL_SECRET: ${{ secrets.RECURRING_BOOKINGS_INTERNAL_SECRET }}
          # #1113's own secret for booking-reminder-run.yml. Until #1177 it was
          # never forwarded, so the API had none and every 15-minute run was a 401.
          BOOKING_REMINDERS_INTERNAL_SECRET: ${{ secrets.BOOKING_REMINDERS_INTERNAL_SECRET }}
          # #1072 (mobile app WP1) — push. Optional: unset means the API sends no
          # push at all and every member still gets their alerts in the app.
          # Set it **base64-encoded** (`base64 -w0 service-accounts.json`): the
          # quadlet lines below are inline and unquoted, and the raw JSON carries
          # double quotes, braces and a PEM's escaped newlines.
          # `parseServiceAccounts()` accepts either form.
          FCM_SERVICE_ACCOUNTS: ${{ secrets.FCM_SERVICE_ACCOUNTS }}
          MOBILE_DEFAULT_APP_ID: ${{ vars.MOBILE_DEFAULT_APP_ID }}
          # The migrations user's DDL credentials, handed to the migration
          # container through the environment rather than its command line.
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          # #1177 — proxy hops (`api/src/domain/forwardedClient.ts`). This job is the
          # only writer of the API's environment: the script below deletes every
          # `Environment=` line of the unit before writing this block, so a value
          # set by hand on the VPS does not survive the next deploy. All optional:
          # unset writes an empty value, which reads as the default (1, 0, 0).
          TRUST_PROXY_HOPS: ${{ vars.TRUST_PROXY_HOPS }}
          PAYMENT_WEBHOOK_RELAY_HOPS: ${{ vars.PAYMENT_WEBHOOK_RELAY_HOPS }}
          INTERNAL_RUN_RELAY_HOPS: ${{ vars.INTERNAL_RUN_RELAY_HOPS }}
          # The global per-IP request budget per 15 minutes; unset reads as 500.
          API_RATE_LIMIT_MAX: ${{ vars.API_RATE_LIMIT_MAX }}
          PRODUCT_SET_BILLING: ${{ vars.PRODUCT_SET_BILLING }}
          # #1175 — gym websites post sign-ups to the admin app's relay. The base
          # is what System → Website Integration shows gyms
          # (`https://admin.<host>/api`); the hop count keys the per-IP limit on
          # the website rather than the relay. Both optional: unset shows the
          # path alone and keys on `req.ip`, as before.
          PUBLIC_REGISTRATION_BASE_URL: ${{ vars.PUBLIC_REGISTRATION_BASE_URL }}
          PUBLIC_REGISTRATION_RELAY_HOPS: ${{ vars.PUBLIC_REGISTRATION_RELAY_HOPS }}
          # #1077 — the iPhone's TestFlight link, shown by Cordel → Mobile builds.
          # Optional: unset leaves the button disabled until the app exists.
          MOBILE_TESTFLIGHT_URL: ${{ vars.MOBILE_TESTFLIGHT_URL }}
        with:
          host: ${{ secrets.CORBACK_SSH_HOST }}
          username: podman
          key: ${{ secrets.CORBACK_SSH_PRIVATE_KEY }}
          envs: APP_NODE_ENV,APP_PORT,CLERK_SECRET_KEY,CLERK_PUBLISHABLE_KEY,CLERK_WEBHOOK_SIGNING_SECRET,CORDEL_FITNESS_DB_HOST,CORDEL_FITNESS_DB_USER,CORDEL_FITNESS_DB_PASSWORD,CORDEL_FITNESS_DB_NAME,CORDEL_FITNESS_ADMIN_URL,CORDEL_FITNESS_MEMBERS_URL,CLOUDFLARE_R2_ENDPOINT,CLOUDFLARE_R2_ACCESS_KEY_ID,CLOUDFLARE_R2_SECRET_ACCESS_KEY,CLOUDFLARE_R2_BUCKET,CLOUDFLARE_R2_PUBLIC_URL,PAYMENT_PROVIDER,PAYMENT_PAGE_URL,PAYMENT_NOTIFICATION_URL,PAYMENT_OK_URL,PAYMENT_KO_URL,MONEI_API_KEY,MONEI_WEBHOOK_SECRET,MONEI_ACCOUNT_ID,BILLING_INTERNAL_SECRET,RECURRING_BOOKINGS_INTERNAL_SECRET,BOOKING_REMINDERS_INTERNAL_SECRET,FCM_SERVICE_ACCOUNTS,MOBILE_DEFAULT_APP_ID,TRUST_PROXY_HOPS,PAYMENT_WEBHOOK_RELAY_HOPS,INTERNAL_RUN_RELAY_HOPS,API_RATE_LIMIT_MAX,PRODUCT_SET_BILLING,PUBLIC_REGISTRATION_BASE_URL,PUBLIC_REGISTRATION_RELAY_HOPS,MOBILE_TESTFLIGHT_URL,DATABASE_URL_MIGRATIONS
          script: |
            set -euo pipefail

            echo "${{ secrets.GHCR_PAT }}" | podman login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Each deploy pulls a new :latest and the previous image loses its
            # tag; those dangling images filled the disk and deploys stopped at
            # the check below. Prune only dangling images: a tagged image another
            # app's deploy (admin/member/payment, same host) just pulled is safe.
            podman image prune -f || true

            # Check disk space before pulling (fail if less than 1GB free)
            AVAILABLE=$(df / --output=avail | tail -1)
            if [ "$AVAILABLE" -lt 1048576 ]; then
              echo "ERROR: Less than 1GB free on disk (${AVAILABLE}KB available). Aborting deploy."
              exit 1
            fi

            podman pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # Run DB migrations from the VPS (HeatWave is VCN-private; the CI
            # runner cannot reach it). Uses the DDL-privileged migrations user.
            # `-e NAME` with no value copies it from this shell's environment, so
            # the credentials never appear on podman's command line (#1192).
            DATABASE_URL="$DATABASE_URL_MIGRATIONS" podman run --rm \
              -e DATABASE_URL \
              ghcr.io/${{ env.IMAGE_NAME }}:latest \
              npx knex migrate:latest --knexfile knexfile.cjs

            # --- Runtime env: sync from GitHub (source of truth) ---------------
            # Required vars must be present; fail loudly rather than deploy a
            # half-configured API.
            for v in CLERK_SECRET_KEY CLERK_WEBHOOK_SIGNING_SECRET \
                     CORDEL_FITNESS_DB_HOST CORDEL_FITNESS_DB_USER \
                     CORDEL_FITNESS_DB_PASSWORD CORDEL_FITNESS_DB_NAME \
                     CORDEL_FITNESS_ADMIN_URL CORDEL_FITNESS_MEMBERS_URL \
                     MONEI_API_KEY MONEI_WEBHOOK_SECRET MONEI_ACCOUNT_ID \
                     BILLING_INTERNAL_SECRET RECURRING_BOOKINGS_INTERNAL_SECRET; do
              if [ -z "${!v:-}" ]; then echo "ERROR: $v is empty in GitHub env 'dev'"; exit 1; fi
            done
            # #1177: optional rather than required so this deploy does not fail
            # before the secret exists — but loud, because without it every
            # booking-reminder-run.yml pass is a 401 and no member is reminded.
            if [ -z "${BOOKING_REMINDERS_INTERNAL_SECRET:-}" ]; then
              echo "WARNING: BOOKING_REMINDERS_INTERNAL_SECRET is empty — POST /booking-reminders/run will answer 401 (#1113)"
            fi

            # The values go into an env file only the `podman` user can read, and
            # the unit carries one `EnvironmentFile=` line pointing at it, which
            # quadlet turns into `podman run --env-file <path>`. Never inline
            # `Environment=KEY=value` lines (the pre-#1192 shape): quadlet passes
            # those as `--env KEY=value` on podman's command line, journald
            # records that command line in the `_CMDLINE` field of podman's own
            # log entries, and the host's log shipper sends it to Grafana Cloud
            # Loki — every secret below was readable there. GitHub stays the
            # single source of truth: the file is regenerated on every deploy and
            # is never hand-edited on the VPS.
            CF="$HOME/.config/containers/systemd/fitness-api.container"
            if [ ! -f "$CF" ]; then echo "ERROR: quadlet $CF not found"; exit 1; fi
            if ! grep -q '^\[Container\]$' "$CF"; then
              echo "ERROR: [Container] section not found in $CF"; exit 1
            fi

            umask 077
            cp "$CF" "$CF.bak.$(date +%s)"
            # Keep only the 3 most recent backups — older ones still carry the
            # inline secrets of the pre-#1192 shape.
            ls -t "$CF".bak.* 2>/dev/null | tail -n +4 | xargs -r rm -f

            ENV_DIR="$HOME/.config/fitness-api"
            ENV_FILE="$ENV_DIR/api.env"
            mkdir -p "$ENV_DIR"
            chmod 700 "$ENV_DIR"
            # podman's --env-file format: one KEY=value per line, the value taken
            # literally to the end of the line (no quoting, no expansion), so a
            # multi-line value must be base64-encoded first (FCM_SERVICE_ACCOUNTS
            # already is). Written to a temporary file and moved into place, so a
            # failed write never leaves the API with half an environment.
            ENV_TMP="$(mktemp "$ENV_DIR/api.env.XXXXXX")"
            cat > "$ENV_TMP" <<ENVEOF
            NODE_ENV=${APP_NODE_ENV}
            PORT=${APP_PORT}
            CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
            CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
            CLERK_WEBHOOK_SIGNING_SECRET=${CLERK_WEBHOOK_SIGNING_SECRET}
            CORDEL_FITNESS_DB_HOST=${CORDEL_FITNESS_DB_HOST}
            CORDEL_FITNESS_DB_USER=${CORDEL_FITNESS_DB_USER}
            CORDEL_FITNESS_DB_PASSWORD=${CORDEL_FITNESS_DB_PASSWORD}
            CORDEL_FITNESS_DB_NAME=${CORDEL_FITNESS_DB_NAME}
            CORDEL_FITNESS_ADMIN_URL=${CORDEL_FITNESS_ADMIN_URL}
            CORDEL_FITNESS_MEMBERS_URL=${CORDEL_FITNESS_MEMBERS_URL}
            CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT:-}
            CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
            CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
            CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET:-}
            CLOUDFLARE_R2_PUBLIC_URL=${CLOUDFLARE_R2_PUBLIC_URL:-}
            PAYMENT_PROVIDER=${PAYMENT_PROVIDER}
            PAYMENT_PAGE_URL=${PAYMENT_PAGE_URL}
            PAYMENT_NOTIFICATION_URL=${PAYMENT_NOTIFICATION_URL}
            PAYMENT_OK_URL=${PAYMENT_OK_URL}
            PAYMENT_KO_URL=${PAYMENT_KO_URL}
            MONEI_API_KEY=${MONEI_API_KEY}
            MONEI_WEBHOOK_SECRET=${MONEI_WEBHOOK_SECRET}
            MONEI_ACCOUNT_ID=${MONEI_ACCOUNT_ID}
            BILLING_INTERNAL_SECRET=${BILLING_INTERNAL_SECRET}
            RECURRING_BOOKINGS_INTERNAL_SECRET=${RECURRING_BOOKINGS_INTERNAL_SECRET}
            BOOKING_REMINDERS_INTERNAL_SECRET=${BOOKING_REMINDERS_INTERNAL_SECRET:-}
            FCM_SERVICE_ACCOUNTS=${FCM_SERVICE_ACCOUNTS:-}
            MOBILE_DEFAULT_APP_ID=${MOBILE_DEFAULT_APP_ID:-}
            TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-}
            PAYMENT_WEBHOOK_RELAY_HOPS=${PAYMENT_WEBHOOK_RELAY_HOPS:-}
            INTERNAL_RUN_RELAY_HOPS=${INTERNAL_RUN_RELAY_HOPS:-}
            API_RATE_LIMIT_MAX=${API_RATE_LIMIT_MAX:-}
            PRODUCT_SET_BILLING=${PRODUCT_SET_BILLING:-}
            PUBLIC_REGISTRATION_BASE_URL=${PUBLIC_REGISTRATION_BASE_URL:-}
            PUBLIC_REGISTRATION_RELAY_HOPS=${PUBLIC_REGISTRATION_RELAY_HOPS:-}
            MOBILE_TESTFLIGHT_URL=${MOBILE_TESTFLIGHT_URL:-}
            ENVEOF
            chmod 600 "$ENV_TMP"
            mv -f "$ENV_TMP" "$ENV_FILE"

            # Drop this unit's previous Environment=/EnvironmentFile= lines —
            # including any inline secrets a pre-#1192 deploy left there — then
            # point it at the file, right after [Container].
            sed -i '/^Environment=/d; /^EnvironmentFile=/d' "$CF"
            sed -i "/^\[Container\]$/a EnvironmentFile=$ENV_FILE" "$CF"

            # #1186: the API's output goes to journald, where the hosts' log
            # collector reads it, exactly as corfront's three units already do
            # (`LogDriver=journald`). Without it this unit named no log driver
            # and not one line the API wrote ever reached Grafana Cloud Loki.
            # Rewritten every deploy, so a hand edit of the line cannot drift.
            sed -i '/^LogDriver=/d' "$CF"
            sed -i "/^\[Container\]$/a LogDriver=journald" "$CF"

            # Retire the old EnvironmentFile-based secrets file (#448's shape).
            rm -f "$HOME/fitness-api.env"

            systemctl --user daemon-reload

            if ! systemctl --user restart fitness-api.service; then
              echo "ERROR: systemctl restart failed"
              systemctl --user status fitness-api.service --no-pager --lines=40 || true
              journalctl --user -xeu fitness-api.service --no-pager -n 60 || true
              podman ps -a --filter name=fitness-api || true
              exit 1
            fi

            sleep 3
            curl -sf --max-time 5 http://localhost:3000/health || \
              { echo "ERROR: /health not responding"; systemctl --user status fitness-api.service --no-pager || true; podman logs fitness-api 2>/dev/null || true; exit 1; }
            echo "Health check OK"

            # Confirm the runtime env keys reached the container (values hidden).
            echo "=== container env keys (redacted) ==="
            podman inspect fitness-api --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | sed -E 's/=.*/=<set>/' | sort -u
