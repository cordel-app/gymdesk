name: Deploy Payment App

on:
  push:
    branches: [main]
    paths:
      - 'apps/payment/**'
      - '.github/workflows/deploy-payment.yml'
  workflow_dispatch:
    # #784: a manual run picks its GitHub environment; a push to main (no
    # input) deploys to `dev`, exactly as before.
    inputs:
      environment:
        description: GitHub environment to deploy to
        type: choice
        options: [dev, pro]
        default: dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fitness-pay

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: apps/payment
          file: apps/payment/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          no-cache: true

      - name: Deploy to corfront
        uses: appleboy/ssh-action@v1
        env:
          CORDEL_FITNESS_API_PUBLIC_URL: ${{ vars.CORDEL_FITNESS_API_PUBLIC_URL }}
          CORDEL_FITNESS_API_INTERNAL_URL: ${{ vars.CORDEL_FITNESS_API_INTERNAL_URL }}
        with:
          host: ${{ secrets.CORFRONT_SSH_HOST }}
          username: podman
          key: ${{ secrets.CORFRONT_SSH_PRIVATE_KEY }}
          envs: CORDEL_FITNESS_API_PUBLIC_URL,CORDEL_FITNESS_API_INTERNAL_URL
          script: |
            set -euo pipefail

            echo "${{ secrets.GHCR_PAT }}" | podman login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Each deploy pulls a new :latest and the previous image loses its
            # tag; those dangling images fill the disk and stop deploys at the
            # check below (#1850 follow-up: corfront hit 780 MB free). Prune only
            # dangling images: a tagged image, or one a running container uses,
            # is never touched — which also makes this safe for the other two
            # apps that deploy to this host.
            podman image prune -f || true

            AVAILABLE=$(df / --output=avail | tail -1)
            if [ "$AVAILABLE" -lt 1048576 ]; then
              echo "ERROR: Less than 1GB free on disk (${AVAILABLE}KB available). Aborting deploy."
              exit 1
            fi

            podman pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            UNIT="$HOME/.config/containers/systemd/fitness-pay.container"
            if [ ! -f "$UNIT" ]; then
              echo "ERROR: Oscar's quadlet is missing at $UNIT"
              echo "Create it with Image=ghcr.io/${{ env.IMAGE_NAME }}:latest and PublishPort=8083:80"
              echo "then: systemctl --user daemon-reload && systemctl --user start fitness-pay"
              exit 1
            fi

            # --- Runtime env: sync from GitHub (source of truth) ---------------
            # Like deploy.yml (#1177): this job is the only writer of the unit's
            # Environment= lines. Every deploy deletes them and writes the block
            # below from the GitHub environment, so a value is changed in GitHub and
            # redeployed, never hand-edited on corfront. The rest of the unit (ports,
            # network, restart policy) stays Oscar's and is not touched.
            if ! grep -q '^\[Container\]$' "$UNIT"; then
              echo "ERROR: [Container] section not found in $UNIT"; exit 1
            fi
            # The API address the unit carries now, printed so a change is visible in
            # the run log. Addresses only; a secret's value is never printed.
            for k in CORDEL_FITNESS_API_PUBLIC_URL CORDEL_FITNESS_API_INTERNAL_URL; do
              cur=$(sed -n "s/^Environment=\"\{0,1\}$k=//p" "$UNIT" | sed 's/^"//; s/"$//')
              echo "Unit $k (before): ${cur:-<unset>} -> GitHub: ${!k:-<unset>}"
            done
            # Required values must be present: fail before the unit is touched, so a
            # missing GitHub variable leaves the running app exactly as it was.
            for v in CORDEL_FITNESS_API_PUBLIC_URL CORDEL_FITNESS_API_INTERNAL_URL; do
              if [ -z "${!v:-}" ]; then echo "ERROR: $v is empty in GitHub env '${{ inputs.environment || 'dev' }}'"; exit 1; fi
            done
            # A key the unit carries that this job does not write would be lost on
            # the first deploy. Refuse instead, naming the keys (never the values),
            # so it is added to GitHub and to this list rather than dropped silently.
            # CORDEL_FITNESS_API_URL is retired: the unit carried it, but the payment
            # app reads only the two addresses above (its nginx template), so it is
            # dropped on purpose rather than refused.
            KNOWN=" CORDEL_FITNESS_API_PUBLIC_URL CORDEL_FITNESS_API_INTERNAL_URL CORDEL_FITNESS_API_URL "
            UNKNOWN=""
            for k in $(sed -n 's/^Environment=//p' "$UNIT" | sed 's/^"//; s/=.*//'); do
              case "$KNOWN" in *" $k "*) ;; *) UNKNOWN="$UNKNOWN $k" ;; esac
            done
            if [ -n "$UNKNOWN" ]; then
              echo "ERROR: $UNIT sets variables this workflow does not manage:$UNKNOWN"
              echo "Add them to GitHub and to this workflow first; nothing was changed."
              exit 1
            fi

            umask 077
            cp "$UNIT" "$UNIT.bak.$(date +%s)"
            ls -t "$UNIT".bak.* 2>/dev/null | tail -n +4 | xargs -r rm -f
            # One KEY=value per line; `%` is a systemd specifier, so it is doubled.
            ENV_TMP="$(mktemp)"
            cat > "$ENV_TMP" <<ENVEOF
            CORDEL_FITNESS_API_PUBLIC_URL=${CORDEL_FITNESS_API_PUBLIC_URL}
            CORDEL_FITNESS_API_INTERNAL_URL=${CORDEL_FITNESS_API_INTERNAL_URL}
            ENVEOF
            # An optional variable left unset is not written at all, so the app
            # reads its own default rather than an empty string.
            sed -i '/^[A-Z_0-9]*=$/d' "$ENV_TMP"
            UNIT_ENV="$(mktemp)"
            sed 's/%/%%/g; s/^/Environment=/' "$ENV_TMP" > "$UNIT_ENV"
            rm -f "$ENV_TMP"
            sed -i '/^Environment=/d' "$UNIT"
            sed -i "/^\[Container\]$/r $UNIT_ENV" "$UNIT"
            rm -f "$UNIT_ENV"
            systemctl --user daemon-reload

            # The image and the environment are refreshed; restart picks up both.
            if ! systemctl --user restart fitness-pay.service; then
              echo "ERROR: systemctl restart failed"
              systemctl --user status fitness-pay.service --no-pager --lines=40 || true
              journalctl --user -xeu fitness-pay.service --no-pager -n 60 || true
              podman ps -a --filter name=fitness-pay || true
              echo "--- image inspection ---"
              podman image inspect ghcr.io/${{ env.IMAGE_NAME }}:latest --format '{{.Architecture}} / {{.Os}} / cmd={{.Config.Cmd}} / entrypoint={{.Config.Entrypoint}}' || true
              echo "--- html probe ---"
              podman run --rm --entrypoint /bin/sh ghcr.io/${{ env.IMAGE_NAME }}:latest -c 'ls -la /usr/share/nginx/html' 2>&1 || echo "(entrypoint probe failed)"
              exit 1
            fi

            # Prints why the health check below failed rather than only that it did:
            # every frontend deploy on corfront has failed it since 2026-10-04 ~22:00
            # UTC while the public hostnames kept answering. Read-only.
            diagnose() {
              echo "--- health check diagnostics (:8083/) ---"
              for h in localhost 127.0.0.1 '[::1]'; do
                printf '%s -> ' "$h"
                curl -sS -o /dev/null --max-time 5 -w 'HTTP %{http_code} from %{remote_ip}\n' "http://$h:8083/" 2>&1 || true
              done
              echo "--- localhost resolves to ---"; getent ahosts localhost || true
              echo "--- listeners on :8083 ---"; ss -tlnp 2>/dev/null | grep ':8083' || echo "nothing listening on :8083"
              echo "--- published ports ---"; podman port fitness-pay 2>&1 || true
              echo "--- proxy variables ---"; p=$(env | grep -i -E '^(http|https|no|all)_proxy=' | sed -E 's#(://)[^@/]*@#\1***@#' || true); echo "${p:-none set}"
              echo "--- from inside the container ---"
              podman exec fitness-pay sh -c 'curl -sS -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8083/ 2>&1 || wget -qS -O /dev/null http://127.0.0.1:8083/ 2>&1 | head -1' 2>&1 || true
            }

            # 127.0.0.1, never `localhost`: on corfront `localhost` resolves to ::1 first,
            # pasta accepts the IPv6 connection and the app inside answers only IPv4, so
            # the connection is reset and curl never falls back (every frontend deploy
            # failed this check from 2026-10-04 ~22:00 UTC until this was found, #1171).
            sleep 3
            curl -sf --max-time 10 -o /dev/null http://127.0.0.1:8083/ || \
              { echo "ERROR: payment page not responding on :8083"; diagnose; systemctl --user status fitness-pay.service --no-pager || true; podman logs fitness-pay 2>/dev/null || true; exit 1; }

            # #1083 — the webhook relay, end to end. Monei's own dashboard
            # preflights a webhook URL with a GET, and the API answers that with
            # 200 { ok: true }, so this probe is exactly what Monei will do:
            # a 2xx here means the relay reached the API at the internal
            # address this container is configured with. A failure means
            # payments would not be confirmed, so it fails the deploy.
            curl -sf --max-time 10 -o /dev/null http://127.0.0.1:8083/webhooks/payment || \
              { echo "ERROR: webhook relay not reaching the API (CORDEL_FITNESS_API_INTERNAL_URL)"; podman logs fitness-pay 2>/dev/null | tail -40 || true; exit 1; }
            echo "Health check OK"
