name: Deploy Payment App

on:
  push:
    branches: [main]
    paths:
      - 'apps/payment/**'
      - '.github/workflows/deploy-payment.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fitness-payment

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04-arm
    environment: dev
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: apps/payment
          file: apps/payment/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          no-cache: true

      - name: Deploy to corfront
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORFRONT_SSH_HOST }}
          username: podman
          key: ${{ secrets.CORFRONT_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            echo "${{ secrets.GHCR_PAT }}" | podman login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            AVAILABLE=$(df / --output=avail | tail -1)
            if [ "$AVAILABLE" -lt 1048576 ]; then
              echo "ERROR: Less than 1GB free on disk (${AVAILABLE}KB available). Aborting deploy."
              exit 1
            fi

            podman pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            UNIT="$HOME/.config/containers/systemd/fitness-payment.container"
            if [ ! -f "$UNIT" ]; then
              echo "ERROR: Oscar's quadlet is missing at $UNIT"
              echo "Create it with Image=ghcr.io/${{ env.IMAGE_NAME }}:latest and PublishPort=8083:80"
              echo "then: systemctl --user daemon-reload && systemctl --user start fitness-payment"
              exit 1
            fi

            # Oscar owns the systemd unit (ports, restart policy);
            # we just refresh the image and restart it.
            if ! systemctl --user restart fitness-payment.service; then
              echo "ERROR: systemctl restart failed"
              systemctl --user status fitness-payment.service --no-pager --lines=40 || true
              journalctl --user -xeu fitness-payment.service --no-pager -n 60 || true
              podman ps -a --filter name=fitness-payment || true
              echo "--- image inspection ---"
              podman image inspect ghcr.io/${{ env.IMAGE_NAME }}:latest --format '{{.Architecture}} / {{.Os}} / cmd={{.Config.Cmd}} / entrypoint={{.Config.Entrypoint}}' || true
              echo "--- html probe ---"
              podman run --rm --entrypoint /bin/sh ghcr.io/${{ env.IMAGE_NAME }}:latest -c 'ls -la /usr/share/nginx/html' 2>&1 || echo "(entrypoint probe failed)"
              exit 1
            fi

            sleep 3
            curl -sf --max-time 10 -o /dev/null http://localhost:8083/ || \
              { echo "ERROR: payment page not responding on :8083"; systemctl --user status fitness-payment.service --no-pager || true; podman logs fitness-payment 2>/dev/null || true; exit 1; }
            echo "Health check OK"
